name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sunday
          POSTGRES_PASSWORD: sunday
          POSTGRES_DB: sundaysong
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sunday -d sundaysong"
          --health-interval 5s --health-timeout 5s --health-retries 20
      meilisearch:
        image: getmeili/meilisearch:v1.10
        env:
          MEILI_MASTER_KEY: dev_meili_master_key_change_me
          MEILI_NO_ANALYTICS: "true"
        ports:
          - 7700:7700

    env:
      DATABASE_URL: postgres://sunday:sunday@localhost:5432/sundaysong
      MEILI_HOST: http://localhost:7700
      MEILI_MASTER_KEY: dev_meili_master_key_change_me

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Prepare database
        run: pnpm db:migrate

      - name: Test
        run: pnpm -r test

      - name: Build web
        run: pnpm --filter @sundaysong/web build
